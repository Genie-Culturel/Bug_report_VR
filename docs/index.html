    const LOAD_ERROR_MESSAGE = 'Impossible de charger les données, réessaie';
    const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

    function isValidUuid(value) {
      return typeof value === 'string' && UUID_RE.test(value.trim());
    }

    // ===== AUTH MANAGER =====
    const ACCESS_PIN = '1950';
    const AUTH_STORAGE_KEY = 'vrc_auth_status';

    class AuthManager {
      constructor() {
        this.isAuthenticated = this.checkAuth();
      }
      checkAuth() {
        return sessionStorage.getItem(AUTH_STORAGE_KEY) === 'authenticated';
      }
      authenticate(pin) {
        if (pin === ACCESS_PIN) {
          sessionStorage.setItem(AUTH_STORAGE_KEY, 'authenticated');
          this.isAuthenticated = true;
          return true;
        }
        return false;
      }
      logout() {
        sessionStorage.removeItem(AUTH_STORAGE_KEY);
        this.isAuthenticated = false;
      }
    }
    const authManager = new AuthManager();

    // ===== SUPABASE ADAPTER (per-row, never rewrites the whole dataset) =====
    class SupabaseAdapter {
      constructor() {
        this.isReady = false;
        this.loadSucceeded = false;
        this.data = { sessions: [], items: [] };
        this.onDataChangeCallback = null;
        this.lastError = null;
        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
          this.lastError = 'supabase-js not loaded';
          this.client = null;
        } else {
          this.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
      }

      assertWritable() {
        if (!this.isReady) throw new Error('Storage not initialized');
        if (!this.loadSucceeded) throw new Error(LOAD_ERROR_MESSAGE);
        if (!this.client) throw new Error(LOAD_ERROR_MESSAGE);
      }

      notify() {
        if (this.onDataChangeCallback) {
          this.onDataChangeCallback(this.data);
        }
      }

      normalizeTime(value) {
        if (!value) return '';
        const str = String(value).trim();
        const match = str.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
        if (!match) return str;
        const hh = match[1].padStart(2, '0');
        const mm = match[2];
        const ss = (match[3] || '00');
        return `${hh}:${mm}:${ss}`;
      }

      normalizeTimeShort(value) {
        const full = this.normalizeTime(value);
        return full ? full.slice(0, 5) : '';
      }

      mapSession(row, number = 0) {
        const createdAt = row.created_at || new Date().toISOString();
        return {
          id: row.id,
          ref: row.ref || '',
          vr_session_id: row.vr_session_id || null,
          number,
          game_name: row.game || '',
          date: row.session_date || '',
          panel_size: parseInt(row.panel, 10) || 0,
          note_taker: row.gm || '',
          remarks: row.remarks || '',
          start_time: this.normalizeTime(row.session_time),
          start_timestamp: createdAt ? new Date(createdAt).getTime() : Date.now(),
          is_active: true,
          duration: '00:00:00',
          created_at: createdAt
        };
      }

      mapEntry(row) {
        const extra = row.extra && typeof row.extra === 'object' ? row.extra : {};
        const archived = row.status === 'archived' || row.criticality === 'archived';
        return {
          id: row.id,
          type: row.category || extra.type || 'bug',
          severity: archived ? 'archived' : (row.criticality || extra.severity || 'info'),
          content: row.description || '',
          session_id: row.bug_session_id,
          position: Number.isInteger(row.position) ? row.position : 0,
          status: row.status || 'open',
          game_name: extra.game_name || '',
          session_date: extra.session_date || '',
          elapsed_time: extra.elapsed_time || '00:00:00',
          was_added_during_session: extra.was_added_during_session === true || extra.was_added_during_session === 'TRUE',
          created_at: row.created_at || new Date().toISOString()
        };
      }

      assignSessionNumbers() {
        const ordered = [...this.data.sessions].sort((a, b) => {
          const ta = new Date(a.created_at).getTime();
          const tb = new Date(b.created_at).getTime();
          return ta - tb;
        });
        ordered.forEach((session, index) => {
          session.number = index + 1;
        });
      }

      sessionToRow(session) {
        const time = this.normalizeTime(session.start_time) || null;
        const vrSessionId = isValidUuid(session.vr_session_id) ? session.vr_session_id.trim() : null;
        return {
          ref: session.ref ? String(session.ref) : null,
          vr_session_id: vrSessionId,
          game: session.game_name,
          session_date: session.date,
          session_time: time,
          panel: session.panel_size != null && session.panel_size !== '' ? String(session.panel_size) : null,
          gm: session.note_taker || null,
          remarks: session.remarks || null
        };
      }

      isForeignKeyError(error) {
        const message = (error && (error.message || error.details || '')) || '';
        return !!(error && (error.code === '23503' || /foreign key/i.test(message)));
      }

      itemToRow(item) {
        const archived = item.severity === 'archived' || item.status === 'archived';
        const criticality = archived
          ? (item.severity && item.severity !== 'archived' ? item.severity : 'info')
          : (item.severity || 'info');
        return {
          bug_session_id: item.session_id,
          description: item.content,
          criticality,
          category: item.type || null,
          position: Number.isInteger(item.position) ? item.position : 0,
          status: archived ? 'archived' : (item.status || 'open'),
          extra: {
            elapsed_time: item.elapsed_time || '00:00:00',
            was_added_during_session: !!item.was_added_during_session,
            game_name: item.game_name || '',
            session_date: item.session_date || ''
          }
        };
      }

      async initialize() {
        try {
          if (!this.client) {
            throw new Error(LOAD_ERROR_MESSAGE);
          }
          console.log('Initializing Supabase adapter...');
          const { data: sessions, error: sessionError } = await this.client
            .from('gh_bug_sessions')
            .select('*')
            .order('created_at', { ascending: true });
          if (sessionError) throw sessionError;

          const { data: entries, error: entryError } = await this.client
            .from('gh_bug_entries')
            .select('*')
            .order('position', { ascending: true })
            .order('created_at', { ascending: true });
          if (entryError) throw entryError;

          this.data = {
            sessions: (sessions || []).map((row) => this.mapSession(row)),
            items: (entries || []).map((row) => this.mapEntry(row))
          };
          this.assignSessionNumbers();
          this.isReady = true;
          this.loadSucceeded = true;
          this.lastError = null;
          console.log('Supabase initialized');
        } catch (error) {
          console.error('Failed to initialize Supabase:', error);
          this.lastError = error.message || String(error);
          this.isReady = true;
          this.loadSucceeded = false;
          this.data = { sessions: [], items: [] };
          throw new Error(LOAD_ERROR_MESSAGE);
        }
      }

      isSessionRecord(record) {
        return record && record.session_id === undefined && record.bug_session_id === undefined;
      }

      async create(record) {
        this.assertWritable();
        try {
          if (this.isSessionRecord(record)) {
            const row = this.sessionToRow(record);
            let { data, error } = await this.client
              .from('gh_bug_sessions')
              .insert(row)
              .select()
              .single();
            if (error && row.vr_session_id && this.isForeignKeyError(error)) {
              console.warn('vr_session_id does not match an existing vr_sessions row; saving without vr_session_id', row.vr_session_id, error);
              const fallback = { ...row, vr_session_id: null };
              const retry = await this.client
                .from('gh_bug_sessions')
                .insert(fallback)
                .select()
                .single();
              data = retry.data;
              error = retry.error;
            }
            if (error) {
              const isDuplicate = error.code === '23505' || /duplicate/i.test(error.message || '');
              if (isDuplicate && row.ref) {
                const existing = await this.client.from('gh_bug_sessions').select('*').eq('ref', row.ref).maybeSingle();
                if (existing.error) throw existing.error;
                if (existing.data) {
                  const mappedExisting = this.mapSession(existing.data);
                  if (!this.data.sessions.find(s => s.id === mappedExisting.id)) {
                    this.data.sessions.push(mappedExisting);
                    this.assignSessionNumbers();
                  }
                  this.notify();
                  return mappedExisting;
                }
              }
              throw error;
            }
            const mapped = this.mapSession(data);
            this.data.sessions.push(mapped);
            this.assignSessionNumbers();
            this.notify();
            return mapped;
          }

          const row = this.itemToRow(record);
          const { data, error } = await this.client
            .from('gh_bug_entries')
            .insert(row)
            .select()
            .single();
          if (error) throw error;
          const mapped = this.mapEntry(data);
          this.data.items.push(mapped);
          this.notify();
          return mapped;
        } catch (error) {
          console.error('Create failed:', error);
          this.lastError = error.message || String(error);
          throw error;
        }
      }

      async update(record) {
        this.assertWritable();
        try {
          if (this.isSessionRecord(record)) {
            const row = this.sessionToRow(record);
            row.updated_at = new Date().toISOString();
            const { data, error } = await this.client
              .from('gh_bug_sessions')
              .update(row)
              .eq('id', record.id)
              .select()
              .single();
            if (error) throw error;
            const mapped = this.mapSession(data, record.number);
            const idx = this.data.sessions.findIndex(s => s.id === record.id);
            if (idx >= 0) this.data.sessions[idx] = { ...mapped, number: record.number || mapped.number };
            this.notify();
            return mapped;
          }

          const row = this.itemToRow(record);
          row.updated_at = new Date().toISOString();
          const { data, error } = await this.client
            .from('gh_bug_entries')
            .update(row)
            .eq('id', record.id)
            .select()
            .single();
          if (error) throw error;
          const mapped = this.mapEntry(data);
          const idx = this.data.items.findIndex(i => i.id === record.id);
          if (idx >= 0) this.data.items[idx] = mapped;
          this.notify();
          return mapped;
        } catch (error) {
          console.error('Update failed:', error);
          this.lastError = error.message || String(error);
          throw error;
        }
      }

      async delete(record) {
        this.assertWritable();
        try {
          if (this.isSessionRecord(record)) {
            const { error } = await this.client
              .from('gh_bug_sessions')
              .delete()
              .eq('id', record.id);
            if (error) throw error;
            this.data.sessions = this.data.sessions.filter(s => s.id !== record.id);
            this.data.items = this.data.items.filter(i => i.session_id !== record.id);
            this.assignSessionNumbers();
            this.notify();
            return;
          }

          const { error } = await this.client
            .from('gh_bug_entries')
            .delete()
            .eq('id', record.id);
          if (error) throw error;
          this.data.items = this.data.items.filter(i => i.id !== record.id);
          this.notify();
        } catch (error) {
          console.error('Delete failed:', error);
          this.lastError = error.message || String(error);
          throw error;
        }
      }

      async updatePositions(updates) {
        this.assertWritable();
        const results = await Promise.all(updates.map(({ id, position }) =>
          this.client
            .from('gh_bug_entries')
            .update({ position, updated_at: new Date().toISOString() })
            .eq('id', id)
        ));
        const failed = results.find(r => r.error);
        if (failed && failed.error) {
          this.lastError = failed.error.message;
          throw failed.error;
        }
        updates.forEach(({ id, position }) => {
          const item = this.data.items.find(i => i.id === id);
          if (item) item.position = position;
        });
        this.notify();
      }

      setOnDataChange(callback) {
        this.onDataChangeCallback = callback;
      }

      getCurrentData() {
        return this.data;
      }

      getLastError() {
        return this.lastError;
      }
    }

    const storage = new SupabaseAdapter();

    // ===== URL PREFILL MANAGER =====
    class URLPrefillManager {
      constructor() {
        this.params = this.parseURLParams();
        this.processed = false;
      }

      parseURLParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const rawSessionId = (urlParams.get('session_id') || '').trim();
        const params = {
          game: urlParams.get('game') || '',
          date: urlParams.get('date') || '',
          time: urlParams.get('time') || '',
          panel: urlParams.get('panel') || '',
          gm: urlParams.get('gm') || '',
          remarks: urlParams.get('remarks') || '',
          ref: urlParams.get('ref') || '',
          session_id: isValidUuid(rawSessionId) ? rawSessionId : '',
          autostart: urlParams.get('autostart') === '1'
        };
        return params;
      }

      hasParams() {
        return !!this.params.game;
      }

      storeParams() {
        // Store params in sessionStorage to survive auth redirect
        if (this.hasParams()) {
          sessionStorage.setItem('vrc_prefill_params', JSON.stringify(this.params));
        }
      }

      retrieveStoredParams() {
        const stored = sessionStorage.getItem('vrc_prefill_params');
        if (stored) {
          try {
            this.params = JSON.parse(stored);
            sessionStorage.removeItem('vrc_prefill_params');
            return true;
          } catch (e) {
            console.error('Failed to parse stored params:', e);
          }
        }
        return false;
      }

      normalizeTimeShort(value) {
        if (!value) return '';
        const match = String(value).trim().match(/(\d{1,2}):(\d{2})/);
        if (!match) return String(value).trim();
        return `${match[1].padStart(2, '0')}:${match[2]}`;
      }

      checkForDuplicate(sessions) {
        if (this.params.session_id) {
          const byVrSession = sessions.find(s => s.vr_session_id && s.vr_session_id === this.params.session_id);
          if (byVrSession) return byVrSession;
        }

        if (this.params.ref) {
          const byRef = sessions.find(s => s.ref && s.ref === this.params.ref);
          if (byRef) return byRef;
        }

        if (this.params.game && this.params.date && this.params.time) {
          const wantedTime = this.normalizeTimeShort(this.params.time);
          const byGameDateTime = sessions.find(s =>
            s.game_name === this.params.game &&
            s.date === this.params.date &&
            this.normalizeTimeShort(s.start_time) === wantedTime
          );
          if (byGameDateTime) return byGameDateTime;
        }

        return null;
      }

      cleanURL() {
        // Remove URL params without reloading
        if (window.history && window.history.replaceState) {
          const url = window.location.pathname;
          window.history.replaceState({}, document.title, url);
        }
      }
    }

    const urlPrefillManager = new URLPrefillManager();

    class PlaytestManager {
      constructor() {
        this.selectedSessionId = null;
        this.currentFilter = null;
        this.currentGameFilter = null;
        this.sessionTimers = {};
        this.currentItemType = null;
        this.currentEditItemId = null;
        this.data = { sessions: [], items: [] };
        this.sortJournalBySeverity = false;
        this.prefillPending = false;
        this.openPrefillModal = false;
        this.pendingRef = '';
        this.pendingTime = '';
        this.pendingVrSessionId = '';
        this.initializeApp();
      }

      async initializeApp() {
        try {
          await storage.initialize();
          this.data = storage.getCurrentData();
          storage.setOnDataChange((data) => {
            this.data = data;
            this.render();
          });
          
          // Handle URL prefill after data is loaded
          await this.handleURLPrefill();
          
          this.render();
        } catch (error) {
          const app = document.getElementById('app');
          app.innerHTML = `
            <div class="flex h-full w-full items-center justify-center bg-gradient-to-br from-red-950 to-red-900">
              <div class="text-center px-6">
                <i data-lucide="alert-circle" style="width: 64px; height: 64px; margin: 0 auto 16px; color: #fca5a5;"></i>
                <h1 class="text-3xl font-black text-red-200 mb-4">Erreur de chargement</h1>
                <p class="text-red-300 mb-8">${LOAD_ERROR_MESSAGE}</p>
                <button id="btn-retry" class="bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 px-6 py-3 rounded-lg text-white font-bold transition shadow-lg shadow-red-500/20">
                  Réessayer
                </button>
              </div>
            </div>
          `;
          lucide.createIcons();
          document.getElementById('btn-retry')?.addEventListener('click', () => {
            location.reload();
          });
        }
      }

      async handleURLPrefill() {
        urlPrefillManager.retrieveStoredParams();

        if (!urlPrefillManager.hasParams()) {
          return;
        }

        if (!authManager.isAuthenticated) {
          urlPrefillManager.storeParams();
          return;
        }

        if (!storage.loadSucceeded) {
          urlPrefillManager.storeParams();
          throw new Error(LOAD_ERROR_MESSAGE);
        }

        const params = urlPrefillManager.params;
        const existingSession = urlPrefillManager.checkForDuplicate(this.data.sessions);

        if (existingSession) {
          this.selectedSessionId = existingSession.id;
          urlPrefillManager.cleanURL();
          urlPrefillManager.processed = true;
          return;
        }

        if (params.autostart) {
          await this.createSessionFromPrefill(params);
          urlPrefillManager.cleanURL();
          urlPrefillManager.processed = true;
        } else {
          this.prefillPending = true;
        }
      }

      async createSessionFromPrefill(params) {
        if (!storage.loadSucceeded) {
          throw new Error(LOAD_ERROR_MESSAGE);
        }
        const today = new Date().toISOString().slice(0, 10);
        const sessionData = {
          gameName: params.game,
          date: params.date || today,
          panelSize: parseInt(params.panel, 10) || 0,
          noteTaker: params.gm || 'N/A',
          remarks: params.remarks || '',
          time: params.time || '',
          ref: params.ref || '',
          vrSessionId: params.session_id || ''
        };
        const sessionId = await this.addSession(sessionData);
        this.selectedSessionId = sessionId;
      }

      loadData() {
        return this.data;
      }

      async saveData() {
        this.render();
      }

      async persistJournalOrder(sessionId) {
        let sessionItems = this.data.items.filter(i => i.session_id === sessionId);
        if (sessionItems.length === 0) return;

        if (this.sortJournalBySeverity) {
          const severityOrder = { critical: 0, high: 1, medium: 2, low: 3, info: 4, archived: 5 };
          sessionItems.sort((a, b) => {
            const aSeverity = severityOrder[a.severity] ?? 6;
            const bSeverity = severityOrder[b.severity] ?? 6;
            if (aSeverity !== bSeverity) return aSeverity - bSeverity;
            return new Date(a.created_at) - new Date(b.created_at);
          });
        } else {
          sessionItems.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        }

        const updates = sessionItems.map((item, index) => ({ id: item.id, position: index }));
        await storage.updatePositions(updates);
      }

      async addSession(sessionData) {
        const now = new Date();
        const startTime = sessionData.time
          ? storage.normalizeTime(sessionData.time)
          : now.toTimeString().slice(0, 8);

        const sessionToCreate = {
          ref: sessionData.ref || '',
          vr_session_id: sessionData.vrSessionId || '',
          game_name: sessionData.gameName,
          date: sessionData.date,
          panel_size: sessionData.panelSize,
          note_taker: sessionData.noteTaker,
          remarks: sessionData.remarks,
          start_time: startTime
        };

        const created = await storage.create(sessionToCreate);
        this.selectedSessionId = created.id;
        return created.id;
      }

      async addItem(itemData) {
        const session = this.data.sessions.find(s => s.id === itemData.sessionId);
        const elapsedTime = session && session.is_active ? this.getSessionElapsedTime(itemData.sessionId) : (session?.duration || '00:00:00');
        const sessionItems = this.data.items.filter(i => i.session_id === itemData.sessionId);
        const nextPosition = sessionItems.length > 0
          ? Math.max(...sessionItems.map(i => i.position || 0)) + 1
          : 0;

        const itemToCreate = {
          type: itemData.type,
          severity: itemData.severity || 'info',
          content: itemData.content,
          session_id: itemData.sessionId,
          position: nextPosition,
          status: itemData.status || 'open',
          game_name: session?.game_name || '',
          session_date: session?.date || '',
          elapsed_time: elapsedTime,
          was_added_during_session: !!(session && session.is_active)
        };

        await storage.create(itemToCreate);
      }

      async updateItem(itemId, updates) {
        const item = this.data.items.find(i => i.id === itemId);
        if (item) {
          const updated = { ...item, ...updates };
          await storage.update(updated);
        }
      }

      async archiveItem(itemId) {
        const item = this.data.items.find(i => i.id === itemId);
        if (item) {
          const updated = { ...item, severity: 'archived', status: 'archived' };
          await storage.update(updated);
        }
      }

      async deleteItem(itemId) {
        const item = this.data.items.find(i => i.id === itemId);
        if (item) {
          // Show loading state on delete button
          const deleteBtn = document.querySelector(`[data-item-id="${itemId}"].delete-item-btn`);
          if (deleteBtn) {
            deleteBtn.disabled = true;
            deleteBtn.innerHTML = '<i data-lucide="loader" style="width: 16px; height: 16px; animation: spin 1s linear infinite;"></i>';
            lucide.createIcons();
          }
          
          try {
            await storage.delete(item);
          } catch (error) {
            console.error('Delete failed:', error);
            if (deleteBtn) {
              deleteBtn.disabled = false;
              deleteBtn.innerHTML = '<i data-lucide="x" style="width: 16px; height: 16px;"></i>';
              lucide.createIcons();
            }
          }
        }
      }

      async deleteSession(sessionId) {
        // Show loading state on delete button
        const deleteBtn = document.getElementById('btn-delete-session');
        const originalHTML = deleteBtn?.innerHTML;
        
        if (deleteBtn) {
          deleteBtn.disabled = true;
          deleteBtn.innerHTML = '<i data-lucide="loader" class="loading-spinner" style="width: 18px; height: 18px; display: inline; margin-right: 6px;"></i> Suppression...';
          lucide.createIcons();
        }
        
        try {
          const session = this.data.sessions.find(s => s.id === sessionId);
          if (session) {
            await storage.delete(session);
          }
          
          if (this.sessionTimers && this.sessionTimers[sessionId]) {
            clearInterval(this.sessionTimers[sessionId]);
            delete this.sessionTimers[sessionId];
          }
        } catch (error) {
          console.error('Delete session failed:', error);
          alert(error.message || LOAD_ERROR_MESSAGE);
          if (deleteBtn) {
            deleteBtn.disabled = false;
            deleteBtn.innerHTML = originalHTML;
            lucide.createIcons();
          }
        }
      }

      // ===== SESSION TIMER =====
      startSessionTimer(sessionId) {
        if (!this.sessionTimers) this.sessionTimers = {};
        
        const updateElapsed = () => {
          const session = this.data.sessions.find(s => s.id === sessionId);
          if (session && session.is_active) {
            const elapsed = Date.now() - session.start_timestamp;
            const hours = Math.floor(elapsed / 3600000);
            const minutes = Math.floor((elapsed % 3600000) / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const display = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            const elapsedDisplay = document.getElementById('elapsed-time');
            if (elapsedDisplay) {
              elapsedDisplay.textContent = display;
            }
          }
        };
        
        updateElapsed();
        this.sessionTimers[sessionId] = setInterval(updateElapsed, 1000);
      }

      getSessionElapsedTime(sessionId) {
        const session = this.data.sessions.find(s => s.id === sessionId);
        if (!session) return '00:00:00';
        const startTimestamp = typeof session.start_timestamp === 'string' 
          ? new Date(session.start_timestamp).getTime() 
          : session.start_timestamp;
        const elapsed = Date.now() - startTimestamp;
        const hours = Math.floor(elapsed / 3600000);
        const minutes = Math.floor((elapsed % 3600000) / 60000);
        const seconds = Math.floor((elapsed % 60000) / 1000);
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      async endSession(sessionId) {
        const session = this.data.sessions.find(s => s.id === sessionId);
        if (session) {
          // Calculate duration properly using timestamps
          const startTime = typeof session.start_timestamp === 'string' 
            ? parseInt(session.start_timestamp) 
            : session.start_timestamp;
          const endTime = Date.now();
          const elapsed = endTime - startTime;
          
          const hours = Math.floor(elapsed / 3600000);
          const minutes = Math.floor((elapsed % 3600000) / 60000);
          const seconds = Math.floor((elapsed % 60000) / 1000);
          const durationStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
          
          const updatedSession = {
            ...session,
            is_active: false,
            duration: durationStr
          };
          
          await storage.update(updatedSession);
          
          if (this.sessionTimers && this.sessionTimers[sessionId]) {
            clearInterval(this.sessionTimers[sessionId]);
            delete this.sessionTimers[sessionId];
          }
        }
      }

      generateSessionSummary(sessionId) {
        const session = this.data.sessions.find(s => s.id === sessionId);
        if (!session) return '';
        
        let sessionItems = this.data.items
          .filter(i => i.session_id === sessionId);
        
        if (this.sortJournalBySeverity) {
          const severityOrder = { critical: 0, high: 1, medium: 2, low: 3, info: 4, archived: 5 };
          sessionItems.sort((a, b) => {
            const aSeverity = severityOrder[a.severity] ?? 6;
            const bSeverity = severityOrder[b.severity] ?? 6;
            return aSeverity - bSeverity;
          });
        } else {
          sessionItems.sort((a, b) => {
            const pos = (a.position || 0) - (b.position || 0);
            if (pos !== 0) return pos;
            return new Date(a.created_at) - new Date(b.created_at);
          });
        }
        
        if (sessionItems.length === 0) {
          return `<div class="font-mono text-sm">[${session.start_time}] Aucune entrée enregistrée</div>`;
        }

        return sessionItems.map(item => {
          const typeLabel = {
            bug: 'BUG',
            feedback: 'INFO',
            suggestion: 'SUGGESTION',
            task: 'LOG',
            debrief: 'DÉBRIEF'
          }[item.type] || 'AUTRE';
          
          const severityLabel = {
            critical: 'C',
            high: 'E',
            medium: 'M',
            low: 'F',
            info: 'I',
            archived: 'A'
          }[item.severity] || '?';
          
          const timeDisplay = item.was_added_during_session ? item.elapsed_time : '[Après session]';
          
          // Ne pas afficher le timing si le tri par sévérité est activé
          const displayContent = this.sortJournalBySeverity 
            ? `[${severityLabel}] [${typeLabel}] ${item.content}`
            : `${timeDisplay}&nbsp;&nbsp;&nbsp;&nbsp;[${severityLabel}] [${typeLabel}] ${item.content}`;
          
          return `<div class="font-mono text-sm leading-relaxed">
            <span>${displayContent}</span>
          </div>`;
        }).join('');
      }

      // ===== EXPORT FUNCTIONS =====
      exportJSON() {
        const dataStr = JSON.stringify(this.data, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        this.downloadFile(blob, `VRC_Session_Manager_${new Date().toISOString().split('T')[0]}.json`);
      }

      exportCSV() {
        let csv = 'Type,Heure,Sévérité,Contenu,Temps écoulé\n';
        this.data.items.forEach(item => {
          const session = this.data.sessions.find(s => s.id === item.sessionId);
          csv += `"${item.type}","${item.time}","${item.severity || ''}","${item.content}","${item.elapsedTime}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        this.downloadFile(blob, `VRC_Session_Manager_${new Date().toISOString().split('T')[0]}.csv`);
      }

      exportMarkdown() {
        let md = `# Rapport de Session VR\n\n`;
        md += `Généré: ${new Date().toLocaleString('fr-FR')}\n\n`;
        
        this.data.sessions.forEach(session => {
          md += `## Session ${session.number} - ${session.date}\n`;
          md += `- **Heure de début**: ${session.startTime}\n`;
          md += `- **Durée totale**: ${session.duration}\n`;
          md += `- **Panel**: ${session.panelSize} testeurs\n`;
          md += `- **Preneur de notes**: ${session.noteTaker}\n\n`;

          const sessionItems = this.data.items.filter(i => i.sessionId === session.id);
          if (sessionItems.length === 0) {
            md += `Aucune entrée enregistrée.\n\n`;
            return;
          }

          ['bug', 'feedback', 'suggestion', 'debrief', 'task'].forEach(type => {
            const typeItems = sessionItems.filter(i => i.type === type);
            if (typeItems.length > 0) {
              const typeLabel = {
                bug: 'Bug',
                feedback: 'Retours',
                suggestion: 'Suggestions',
                task: 'Tâches',
                debrief: 'Débriefings'
              }[type];
              md += `### ${typeLabel}\n`;
              typeItems.forEach(item => {
                md += `- **${item.content}** [${item.time}]\n`;
              });
              md += '\n';
            }
          });
        });

        const blob = new Blob([md], { type: 'text/markdown' });
        this.downloadFile(blob, `playtest_export_${new Date().toISOString().split('T')[0]}.md`);
      }

      downloadFile(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      downloadSessionJournal(sessionId) {
        const session = this.data.sessions.find(s => s.id === sessionId);
        if (!session) return;

        const journalText = this.generateSessionJournalText(sessionId);
        const filename = `Session_${session.number}_Journal_${new Date().toISOString().split('T')[0]}.txt`;
        const blob = new Blob([journalText], { type: 'text/plain;charset=utf-8' });
        this.downloadFile(blob, filename);
      }

      generateSessionJournalText(sessionId) {
        const session = this.data.sessions.find(s => s.id === sessionId);
        if (!session) return '';

        let text = `RÉSUMÉ DE SESSION - JOURNAL\n`;
        text += `${'='.repeat(60)}\n\n`;
        text += `Session ${session.number} - ${session.game_name}\n`;
        text += `Date: ${session.date}\n`;
        text += `Durée: ${session.duration}\n`;
        text += `Panel: ${session.panel_size} joueurs\n`;
        text += `Preneur de notes: ${session.note_taker}\n`;
        text += `${'='.repeat(60)}\n\n`;

        let sessionItems = this.data.items.filter(i => i.session_id === sessionId);
        if (sessionItems.length === 0) {
          text += `Aucune entrée enregistrée\n`;
          return text;
        }

        // Appliquer le même tri que l'affichage journal
        if (this.sortJournalBySeverity) {
          const severityOrder = { critical: 0, high: 1, medium: 2, low: 3, info: 4, archived: 5 };
          sessionItems.sort((a, b) => {
            const aSeverity = severityOrder[a.severity] ?? 6;
            const bSeverity = severityOrder[b.severity] ?? 6;
            return aSeverity - bSeverity;
          });
        } else {
          sessionItems.sort((a, b) => {
            const pos = (a.position || 0) - (b.position || 0);
            if (pos !== 0) return pos;
            return new Date(a.created_at) - new Date(b.created_at);
          });
        }

        sessionItems.forEach(item => {
          const typeLabel = {
            bug: 'BUG',
            feedback: 'INFO',
            suggestion: 'SUGGESTION',
            task: 'LOG',
            debrief: 'DÉBRIEF'
          }[item.type] || 'AUTRE';
          
          const severityLabel = {
            critical: 'C',
            high: 'E',
            medium: 'M',
            low: 'F',
            info: 'I',
            archived: 'A'
          }[item.severity] || '?';
          
          const timeDisplay = item.was_added_during_session ? item.elapsed_time : '[Après session]';
          
          // Ne pas afficher le timing si le tri par sévérité est activé
          if (this.sortJournalBySeverity) {
            text += `[${severityLabel}] [${typeLabel}] ${item.content}\n`;
          } else {
            text += `${timeDisplay} [${severityLabel}] [${typeLabel}] ${item.content}\n`;
          }

        return text;
      }

      importJSON() {
        const fileInput = document.getElementById('input-import-file');
        const file = fileInput?.files?.[0];
        const statusDiv = document.getElementById('import-status');

        if (!file) {
          statusDiv.textContent = 'Veuillez sélectionner un fichier';
          statusDiv.className = 'text-sm text-red-400';
          return;
        }

        const reader = new FileReader();
        reader.onerror = () => {
          statusDiv.textContent = `Erreur: Impossible de lire le fichier`;
          statusDiv.className = 'text-sm text-red-400';
        };

        reader.onload = (e) => {
          try {
            const content = e.target?.result;
            if (typeof content !== 'string') {
              throw new Error('Contenu de fichier invalide');
            }

            const importedData = JSON.parse(content);
            
            // Validate structure
            if (!importedData || typeof importedData !== 'object') {
              throw new Error('Format JSON invalide');
            }

            if (!Array.isArray(importedData.sessions) || !Array.isArray(importedData.items)) {
              throw new Error('Format de fichier invalide - sessions et items doivent être des listes');
            }

            // Create mapping of old session IDs to new IDs
            const sessionIdMap = {};
            const newSessions = [];

            importedData.sessions.forEach((session, index) => {
              const newSessionId = Date.now().toString() + Math.random();
              sessionIdMap[session.id] = newSessionId;
              
              const newSession = {
                ...session,
                id: newSessionId,
                start_timestamp: session.start_timestamp ? new Date(session.start_timestamp).getTime() : Date.now(),
                created_at: session.created_at || new Date().toISOString()
              };
              newSessions.push(newSession);
            });

            // Map items to new session IDs
            const newItems = importedData.items.map(item => ({
              ...item,
              id: Date.now().toString() + Math.random(),
              session_id: sessionIdMap[item.session_id] || newSessions[0]?.id,
              created_at: item.created_at || new Date().toISOString()
            }));

            // Add to storage via adapter
            (async () => {
              for (const session of newSessions) {
                await storage.create(session);
              }
              for (const item of newItems) {
                await storage.create(item);
              }

              statusDiv.textContent = `✓ ${newSessions.length} session(s) et ${newItems.length} entrée(s) importées`;
              statusDiv.className = 'text-sm text-green-400';

              setTimeout(() => {
                this.hideModal('modal-import');
                fileInput.value = '';
                statusDiv.textContent = '';
              }, 2000);
            })();
          } catch (error) {
            statusDiv.textContent = `Erreur: ${error.message}`;
            statusDiv.className = 'text-sm text-red-400';
          }
        };

        reader.readAsText(file, 'UTF-8');
      }

      // ===== STATISTICS =====
      getStats(gameFilter = null) {
        let items = this.data.items;
        let sessions = this.data.sessions;
        
        if (gameFilter) {
          sessions = sessions.filter(s => s.game_name === gameFilter);
          items = items.filter(i => sessions.some(s => s.id === i.session_id));
        }
        
        // Exclure les éléments archivés du compteur total
        const activeItems = items.filter(i => i.severity !== 'archived');
        const bugs = activeItems.filter(i => i.type === 'bug');
        const openBugs = bugs.filter(i => i.status === 'open');
        const allCritical = activeItems.filter(i => i.severity === 'critical');
        const allHigh = activeItems.filter(i => i.severity === 'high');
        const allLow = activeItems.filter(i => i.severity === 'low');
        const allInfo = activeItems.filter(i => i.severity === 'info');
        
        // Le total d'entrées = nombre d'entrées critiques + élevées + faibles (actives uniquement)
        const totalActiveEntries = allCritical.length + allHigh.length + allLow.length;
        
        return {
          totalSessions: sessions.length,
          totalItems: totalActiveEntries,
          totalBugs: bugs.length,
          openBugs: openBugs.length,
          criticalBugs: allCritical.length,
          highBugs: allHigh.length,
          lowBugs: allLow.length,
          infoBugs: allInfo.length
        };
      }

      getAvailableGames() {
        const games = new Set();
        this.data.sessions.forEach(s => {
          if (s.game_name) games.add(s.game_name);
        });
        return Array.from(games).sort();
      }

      openNewSessionModalWithPrefill() {
        const params = urlPrefillManager.params;
        
        // Show the modal
        this.showModal('modal-new-session');
        
        // Fill the form with params
        const gameSelect = document.getElementById('input-session-game-name');
        const customGameInput = document.getElementById('input-session-game-name-custom');
        const dateInput = document.getElementById('input-session-date');
        const panelInput = document.getElementById('input-session-panel');
        const gmInput = document.getElementById('input-session-note-taker');
        const remarksInput = document.getElementById('input-session-remarks');
        
        // Fill game name
        if (params.game) {
          const gameOptions = Array.from(gameSelect?.options || []).map(o => o.value);
          if (gameOptions.includes(params.game)) {
            gameSelect.value = params.game;
          } else {
            // Use custom field
            gameSelect.value = 'custom';
            customGameInput?.classList.remove('hidden');
            customGameInput.value = params.game;
          }
        }
        
        // Fill other fields
        if (params.date && dateInput) dateInput.value = params.date;
        if (params.panel && panelInput) panelInput.value = params.panel;
        if (params.gm && gmInput) gmInput.value = params.gm;
        if (remarksInput) remarksInput.value = params.remarks || '';
        this.pendingRef = params.ref || '';
        this.pendingTime = params.time || '';
        this.pendingVrSessionId = params.session_id || '';
      }

      render() {
        if (!this.data) this.data = { sessions: [], items: [] };
        const app = document.getElementById('app');

        // Show auth screen if not authenticated
        if (!authManager.isAuthenticated) {
          // Store URL params before showing auth
          urlPrefillManager.storeParams();
          
          app.innerHTML = `
            <div class="auth-screen flex h-full w-full items-center justify-center bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900">
              <div class="auth-wrap text-center px-4 w-full max-w-sm">
                <div class="mb-8">
                  <i data-lucide="lock" style="width: 64px; height: 64px; margin: 0 auto 16px; color: #06b6d4;"></i>
                  <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400">Bug report VR</h1>

                </div>
                
                <div class="auth-card bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl shadow-2xl p-8 w-96 max-w-full border border-purple-800/50 shadow-purple-500/20">

                    <input 
                      type="password" 
                      id="auth-pin-input" 
                      placeholder="••••" 
                      maxlength="4"
                      class="w-full bg-slate-700/50 border border-slate-600/50 focus:border-purple-500/50 rounded-lg px-4 py-3 text-white text-center text-3xl tracking-widest focus:outline-none transition"

          return;
        }
        
        // If we have pending prefill and not autostart, show the form with prefilled data
        if (this.prefillPending && !urlPrefillManager.params.autostart) {
          this.prefillPending = false;
          urlPrefillManager.cleanURL();
          urlPrefillManager.processed = true;
          // Continue to render normally, but mark that we should open the modal
          this.openPrefillModal = true;
        }
        
        app.innerHTML = `
          <div class="app-shell flex h-full flex-col bg-slate-900 text-slate-100">
            ${this.renderHeader()}
            <div class="app-body flex flex-1 overflow-hidden min-w-0">

              ${this.renderMain()}

            ${this.renderModals()}
          </div>

        lucide.createIcons();
      }

      attachAuthListeners() {
        const pinInput = document.getElementById('auth-pin-input');
        const submitBtn = document.getElementById('btn-auth-submit');
        const errorDiv = document.getElementById('auth-error');

        pinInput?.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            this.attemptAuth(pinInput.value, errorDiv);
          }
        });

        submitBtn?.addEventListener('click', () => {
          this.attemptAuth(pinInput.value, errorDiv);
        });
      }

      async attemptAuth(pin, errorDiv) {
        if (authManager.authenticate(pin)) {
          try {
            await this.handleURLPrefill();
            this.render();
          } catch (error) {
            const app = document.getElementById('app');
            app.innerHTML = `
              <div class="flex h-full w-full items-center justify-center bg-gradient-to-br from-red-950 to-red-900">
                <div class="text-center px-6">
                  <i data-lucide="alert-circle" style="width: 64px; height: 64px; margin: 0 auto 16px; color: #fca5a5;"></i>
                  <h1 class="text-3xl font-black text-red-200 mb-4">Erreur de chargement</h1>
                  <p class="text-red-300 mb-8">${LOAD_ERROR_MESSAGE}</p>
                  <button id="btn-retry" class="bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 px-6 py-3 rounded-lg text-white font-bold transition shadow-lg shadow-red-500/20">
                    Réessayer
                  </button>
                </div>
              </div>
            `;
            lucide.createIcons();
            document.getElementById('btn-retry')?.addEventListener('click', () => location.reload());
          }
        } else {
          errorDiv?.classList.remove('hidden');
          setTimeout(() => {
            errorDiv?.classList.add('hidden');
          }, 2000);
        }
      }

        const games = new Set();
        this.data.sessions.forEach(s => {
          if (s.game_name) games.add(s.game_name);

        return Array.from(games).sort();
      }

      renderFilteredView() {
        const filterLabel = {
          critical: 'Critiques',
          high: 'Élevés',
          medium: 'Moyens',
          low: 'Faibles',
          info: 'Info',
          archived: 'Archivées'
        }[this.currentFilter] || 'Entrées';

        const itemsBySession = {};

          if (!itemsBySession[item.session_id]) {
            itemsBySession[item.session_id] = [];
          }
          itemsBySession[item.session_id].push(item);
        });

        const severityColor = {
          critical: '#ef4444',
          high: '#f97316',
          medium: '#eab308',
          low: '#3b82f6',
          info: '#64748b',
          archived: '#fb923c'
        }[this.currentFilter] || '#64748b';

        return `
          <main class="app-main flex-1 overflow-y-auto bg-gradient-to-br from-slate-900 via-slate-950 to-slate-900 p-8 flex flex-col min-w-0">

                                  <span>Sévérité: <span class="text-purple-300 font-semibold">${({critical: 'Critique', high: 'Élevé', medium: 'Moyen', low: 'Faible', info: 'Info'}[item.severity] || item.severity)}</span></span>

            <div class="text-center text-xs text-slate-500 mt-12 pt-4 border-t border-slate-700/30">
              <p>VRC Session Manager • Version ${VERSION}</p>
            </div>
          </main>
        `;

      renderGameFilteredView() {
        const filteredSessions = this.data.sessions.filter(s => s.game_name === this.currentGameFilter);
        
        // Collecter tous les items de ce jeu et les trier par sévérité
        const allGameItems = [];
        const severityOrder = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };
        
        filteredSessions.forEach(session => {
          this.data.items
            .filter(i => i.session_id === session.id)
            .forEach(item => {
              allGameItems.push({ ...item, sessionNumber: session.number });
            });
        });
        
        allGameItems.sort((a, b) => {
          const aSeverity = severityOrder[a.severity] ?? 5;
          const bSeverity = severityOrder[b.severity] ?? 5;
          return aSeverity - bSeverity;
        });

        return `
          <main class="app-main flex-1 overflow-y-auto bg-gradient-to-br from-slate-900 via-slate-950 to-slate-900 p-8 flex flex-col min-w-0">
            <div class="max-w-5xl mx-auto flex-1 w-full min-w-0">

      getSeverityColor(severity) {
        switch(severity) {
          case 'critical': return 'border-red-500';
          case 'high': return 'border-orange-500';
          case 'medium': return 'border-yellow-500';
          case 'low': return 'border-blue-500';
          default: return 'border-slate-500';
        }
      }

      getSeverityHexColor(severity) {
        switch(severity) {
          case 'critical': return '#ef4444';
          case 'high': return '#f97316';
          case 'medium': return '#eab308';
          case 'low': return '#3b82f6';
          case 'archived': return '#fb923c';
          default: return '#64748b';
        }
      }

      formatDuration(duration) {
        // Handle ISO date strings or other formats
        if (!duration) return '00:00:00';
        if (typeof duration === 'string' && duration.includes('T')) {
          // This is an ISO date, extract just the time
          try {
            const parts = duration.split('T')[1].split('.')[0];
            return parts || '00:00:00';
          } catch {
            return '00:00:00';
          }
        }
        // It's already in HH:MM:SS format
        return duration;
      }

      formatSessionDate(dateStr) {
        if (!dateStr) return 'N/A';
        // Handle ISO format like "2026-04-23T22:00:00.000Z"
        if (dateStr.includes('T')) {
          try {
            const date = new Date(dateStr);
            return date.toLocaleDateString('fr-FR');
          } catch {
            return dateStr;
          }
        }
        // Already in proper format
        return dateStr;
      }

      showModal(modalId) {

      attachEventListeners() {
        // Handle prefill modal opening if needed
        if (this.openPrefillModal) {
          this.openPrefillModal = false;
          setTimeout(() => {
            this.openNewSessionModalWithPrefill();
          }, 100);
        }
        
        // Filter by severity
        document.querySelectorAll('[data-filter]').forEach(el => {
          el.addEventListener('click', () => {
            const filter = el.dataset.filter;
            if (filter === 'all') {
              this.currentFilter = null;
            } else {
              this.currentFilter = filter;
            }
            this.render();
          });
        });

        // Close filter view
        document.getElementById('btn-close-filter')?.addEventListener('click', () => {
          this.currentFilter = null;
          this.render();
        });

        // Close game filter view
        document.getElementById('btn-close-game-filter')?.addEventListener('click', () => {
          this.currentGameFilter = null;
          this.render();
        });

        // Filter by games
        document.getElementById('btn-filter-games-header')?.addEventListener('click', () => this.showModal('modal-filter-games'));
        document.getElementById('btn-filter-games')?.addEventListener('click', () => this.showModal('modal-filter-games'));
        document.getElementById('btn-cancel-filter-games')?.addEventListener('click', () => this.hideModal('modal-filter-games'));
        document.querySelectorAll('.game-filter-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const game = e.target.closest('button').dataset.game;
            this.currentGameFilter = game;
            this.hideModal('modal-filter-games');
            this.render();
          });
        });

        // Session Management
        document.getElementById('btn-new-session')?.addEventListener('click', () => {
          this.pendingRef = '';
          this.pendingTime = '';
          this.pendingVrSessionId = '';
          this.showModal('modal-new-session');

        document.getElementById('btn-save-session')?.addEventListener('click', () => this.saveNewSession());
        document.getElementById('btn-cancel-session')?.addEventListener('click', () => this.hideModal('modal-new-session'));
        document.getElementById('btn-delete-session')?.addEventListener('click', () => this.showModal('modal-delete-confirmation'));

        document.getElementById('btn-cancel-delete')?.addEventListener('click', () => this.hideModal('modal-delete-confirmation'));
        document.getElementById('btn-add-item-after')?.addEventListener('click', () => this.showAddItemAfterMenu());
        document.getElementById('input-session-game-name')?.addEventListener('change', (e) => {
          const customInput = document.getElementById('input-session-game-name-custom');
          if (e.target.value === 'custom') {
            customInput?.classList.remove('hidden');
          } else {
            customInput?.classList.add('hidden');
          }
        });

        // Session Selection
        document.querySelectorAll('.session-item').forEach(el => {
          el.addEventListener('click', (e) => {
            if (e.currentTarget.classList.contains('locked-session')) return;
            const sessionId = e.currentTarget.dataset.sessionId;
            this.selectedSessionId = sessionId;
            this.render();
          });
        });

        // Item Management
        document.getElementById('btn-save-item')?.addEventListener('click', () => this.saveNewItem());
        document.getElementById('btn-cancel-item')?.addEventListener('click', () => this.hideModal('modal-add-item'));

        document.querySelectorAll('.edit-item-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const itemId = e.target.closest('button').dataset.itemId;
            this.openEditItemModal(itemId);
          });
        });

        document.getElementById('btn-save-edit-item')?.addEventListener('click', () => this.saveEditItem());
        document.getElementById('btn-cancel-edit-item')?.addEventListener('click', () => this.hideModal('modal-edit-item'));

        document.querySelectorAll('.delete-item-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const itemId = e.target.closest('button').dataset.itemId;
            this.deleteItem(itemId);
          });
        });

        document.querySelectorAll('.archive-item-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const itemId = e.target.closest('button').dataset.itemId;
            const archiveBtn = e.target.closest('button');
            archiveBtn.disabled = true;
            archiveBtn.innerHTML = '<i data-lucide="loader" style="width: 14px; height: 14px; animation: spin 1s linear infinite;"></i>';
            lucide.createIcons();
            
            this.archiveItem(itemId).then(() => {
              this.render();
            }).catch(error => {
              console.error('Archive failed:', error);
              archiveBtn.disabled = false;
              archiveBtn.innerHTML = '<i data-lucide="archive" style="width: 14px; height: 14px; display: inline; margin-right: 4px;"></i> Archiver';
              lucide.createIcons();
            });
          });
        });

        // Export
        document.getElementById('btn-settings')?.addEventListener('click', () => this.showModal('modal-settings'));
        document.getElementById('btn-cancel-settings')?.addEventListener('click', () => this.hideModal('modal-settings'));
        document.getElementById('btn-logout')?.addEventListener('click', () => {
          authManager.logout();
          this.render();
        });
        
        // Export JSON
        const exportBtn = document.getElementById('btn-export-json');
        if (exportBtn) {
          exportBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            this.exportJSON();
          });
        }
        
        // Download session journal
        document.getElementById('btn-download-journal')?.addEventListener('click', () => {
          const selectedSessionId = this.selectedSessionId || (this.data.sessions.find(s => s.is_active)?.id) || (this.data.sessions.length > 0 ? this.data.sessions[0].id : null);
          if (selectedSessionId) {
            this.downloadSessionJournal(selectedSessionId);
          }
        });
        
        // Toggle sort journal by severity — persist the new order via position
        document.getElementById('btn-toggle-sort-journal')?.addEventListener('click', async () => {
          this.sortJournalBySeverity = !this.sortJournalBySeverity;
          const selectedSessionId = this.selectedSessionId
            || (this.data.sessions.find(s => s.is_active)?.id)
            || (this.data.sessions.length > 0 ? this.data.sessions[this.data.sessions.length - 1].id : null);
          try {
            if (selectedSessionId) {
              await this.persistJournalOrder(selectedSessionId);
            }
          } catch (error) {
            console.error('Failed to persist sort order:', error);
            alert(error.message || LOAD_ERROR_MESSAGE);
          }
          this.render();
        });
        
        // Filter archived items
        document.getElementById('btn-filter-archived')?.addEventListener('click', () => {
          this.currentFilter = 'archived';
          this.currentGameFilter = null;
          this.hideModal('modal-settings');
          this.render();
        });
        
        // Filter by games in settings
        document.getElementById('btn-filter-all-games')?.addEventListener('click', () => {
          this.currentGameFilter = null;
          this.hideModal('modal-settings');
          this.render();
        });

        // Settings game filter buttons
        document.querySelectorAll('.settings-game-filter-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const game = e.target.closest('button').dataset.game;
            this.currentGameFilter = game;
            this.hideModal('modal-settings');
            this.render();
          });
        });
      }

      async saveNewSession() {
        const saveBtn = document.getElementById('btn-save-session');
        const originalText = 'Démarrer';
        
        try {
          const gameNameSelect = document.getElementById('input-session-game-name')?.value;
          let gameName = gameNameSelect;
          
          if (gameNameSelect === 'custom') {
            gameName = document.getElementById('input-session-game-name-custom')?.value;
          }
          
          const date = document.getElementById('input-session-date')?.value;
          const panelSize = parseInt(document.getElementById('input-session-panel')?.value || '0');
          const noteTaker = document.getElementById('input-session-note-taker')?.value;
          const remarks = document.getElementById('input-session-remarks')?.value;

          if (!gameName || !date || !panelSize || !noteTaker) {
            alert('Veuillez remplir tous les champs obligatoires');
            return;
          }

          // Désactiver le bouton et afficher un état de chargement
          if (saveBtn) {
            saveBtn.disabled = true;
            saveBtn.textContent = 'Création en cours...';
          }
          
          const newSessionId = await this.addSession({
            gameName,
            date,
            panelSize,
            noteTaker,
            remarks,
            ref: this.pendingRef || '',
            time: this.pendingTime || '',
            vrSessionId: this.pendingVrSessionId || ''
          });
          this.pendingRef = '';
          this.pendingTime = '';
          this.pendingVrSessionId = '';
          
          // Sélectionner la nouvelle session immédiatement
          this.selectedSessionId = newSessionId;
          
          // Quitter les vues filtrées
          this.currentFilter = null;
          this.currentGameFilter = null;
          
          // Vider les champs du formulaire
          document.getElementById('input-session-game-name').value = '';
          document.getElementById('input-session-game-name-custom').value = '';
          document.getElementById('input-session-game-name-custom').classList.add('hidden');
          document.getElementById('input-session-date').value = '';
          document.getElementById('input-session-panel').value = '';
          document.getElementById('input-session-note-taker').value = '';
          document.getElementById('input-session-remarks').value = '';
          
          // Fermer le modal
          this.hideModal('modal-new-session');
          
          // Réinitialiser le bouton
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.textContent = originalText;
          }
          
          // Re-render pour afficher la nouvelle session
          this.render();
          
        } catch (error) {
          console.error('Erreur saveNewSession:', error);
          alert('Erreur lors de la création de la session: ' + error.message);
          
          // Réinitialiser le bouton
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.textContent = originalText;
          }
        }
      }

      saveNewItem() {
        const content = document.getElementById('input-item-content')?.value;
        const severity = document.getElementById('input-item-severity')?.value;

        if (!content) {
          alert('Veuillez remplir la description');
          return;
        }

        // Désactiver le bouton pour éviter les double-clics
        const saveBtn = document.getElementById('btn-save-item');
        if (saveBtn) {
          saveBtn.disabled = true;
          saveBtn.textContent = 'Ajout en cours...';
        }

        // Utiliser la session sélectionnée, pas toujours la dernière
        const selectedSessionId = this.selectedSessionId || (this.data.sessions.find(s => s.is_active)?.id) || (this.data.sessions.length > 0 ? this.data.sessions[0].id : null);
        const selectedSession = this.data.sessions.find(s => s.id === selectedSessionId);
        
        if (!selectedSession) {
          alert('Aucune session sélectionnée');
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Ajouter';
          }
          return;
        }

        this.addItem({
          sessionId: selectedSession.id,
          type: this.currentItemType,
          severity,
          status: 'open',
          content,
          assignedTo: ''
        }).then(() => {
          // Vider et réinitialiser le formulaire
          document.getElementById('input-item-content').value = '';
          document.getElementById('input-item-severity').value = 'info';
          
          // Réinitialiser le bouton
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Ajouter';
          }
          
          this.hideModal('modal-add-item');
        }).catch(error => {
          console.error('Erreur lors de l\'ajout:', error);
          alert(error.message || LOAD_ERROR_MESSAGE);
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Ajouter';
          }
        });
      }

      openEditItemModal(itemId) {
        const item = this.data.items.find(i => i.id === itemId);
        if (!item) return;

        document.getElementById('edit-item-content').value = item.content;
        document.getElementById('edit-item-severity').value = item.severity || 'info';
        this.currentEditItemId = itemId;

        this.showModal('modal-edit-item');
      }

      saveEditItem() {
        const content = document.getElementById('edit-item-content')?.value;
        const severity = document.getElementById('edit-item-severity')?.value;

        if (!content) {
          alert('Veuillez remplir la description');
          return;
        }

        this.updateItem(this.currentEditItemId, {
          content,
          severity
        });

        this.hideModal('modal-edit-item');
      }

      deleteActiveSession() {
        const selectedSessionId = this.selectedSessionId || (this.data.sessions.find(s => s.is_active)?.id) || (this.data.sessions.length > 0 ? this.data.sessions[0].id : null);
        const selectedSession = this.data.sessions.find(s => s.id === selectedSessionId);
        if (selectedSession) {
          this.deleteSession(selectedSessionId);
          this.selectedSessionId = null;
        }
      }

      confirmDeleteSession() {
        const selectedSessionId = this.selectedSessionId || (this.data.sessions.find(s => s.is_active)?.id) || (this.data.sessions.length > 0 ? this.data.sessions[0].id : null);
        const selectedSession = this.data.sessions.find(s => s.id === selectedSessionId);
        if (selectedSession) {
          this.deleteSession(selectedSessionId);
          this.selectedSessionId = null;
          this.hideModal('modal-delete-confirmation');
          this.render();
        }
      }

      showAddItemAfterMenu() {
        const selectedSessionId = this.selectedSessionId || this.data.sessions[0].id;
        const selectedSession = this.data.sessions.find(s => s.id === selectedSessionId);
        if (!selectedSession) return;

        this.selectedSessionId = selectedSessionId;
        
        // Create a temporary modal for type selection
        const modalOverlay = document.getElementById('modal-overlay');
        const modalAddItem = document.getElementById('modal-add-item');
        
        // Show a simple selection modal
        const typeSelection = document.createElement('div');
        typeSelection.id = 'modal-type-selection';
        typeSelection.className = 'hidden fixed inset-0 flex items-center justify-center z-50';
        typeSelection.innerHTML = `
          <div class="modal-box bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl shadow-2xl p-8 w-96 border border-purple-800/50 shadow-purple-500/20">
            <h3 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400 mb-6">Sélectionner le type</h3>
            <div class="grid grid-cols-2 gap-3">
              <button class="type-select-btn bg-gradient-to-r from-red-900/40 to-red-800/40 border border-red-700/30 hover:border-red-600/50 hover:from-red-900/60 hover:to-red-800/60 px-4 py-3 rounded-lg text-red-300 text-sm font-bold transition" data-type="bug">Bug</button>
              <button class="type-select-btn bg-gradient-to-r from-blue-900/40 to-blue-800/40 border border-blue-700/30 hover:border-blue-600/50 hover:from-blue-900/60 hover:to-blue-800/60 px-4 py-3 rounded-lg text-blue-300 text-sm font-bold transition" data-type="feedback">Info</button>
              <button class="type-select-btn bg-gradient-to-r from-green-900/40 to-green-800/40 border border-green-700/30 hover:border-green-600/50 hover:from-green-900/60 hover:to-green-800/60 px-4 py-3 rounded-lg text-green-300 text-sm font-bold transition" data-type="suggestion">Suggestion</button>
              <button class="type-select-btn bg-gradient-to-r from-purple-900/40 to-purple-800/40 border border-purple-700/30 hover:border-purple-600/50 hover:from-purple-900/60 hover:to-purple-800/60 px-4 py-3 rounded-lg text-purple-300 text-sm font-bold transition" data-type="task">Log</button>
            </div>
            <button id="btn-cancel-type-selection" class="w-full bg-slate-700/50 border border-slate-600/50 hover:border-slate-500/50 text-slate-300 px-4 py-3 rounded-lg font-semibold transition mt-6">Annuler</button>
          </div>
        `;
        document.body.appendChild(typeSelection);

        typeSelection.classList.remove('hidden');
        modalOverlay?.classList.remove('hidden');

        typeSelection.querySelectorAll('.type-select-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            this.currentItemType = e.target.closest('button').dataset.type;
            const titles = { bug: 'Ajouter un bug', feedback: 'Ajouter une info', suggestion: 'Ajouter une suggestion', task: 'Ajouter un log' };
            const titleEl = document.getElementById('modal-item-title');
            if (titleEl) titleEl.textContent = titles[this.currentItemType] || 'Ajouter une entrée';
            typeSelection.remove();
            this.showModal('modal-add-item');
          });
        });

        document.getElementById('btn-cancel-type-selection')?.addEventListener('click', () => {
          typeSelection.remove();
          modalOverlay?.classList.add('hidden');
        });
      }
    }

    // Initialize app
    window.addEventListener('DOMContentLoaded', () => {
      new PlaytestManager();
    });
  </script>
  <style>body { box-sizing: border-box; }</style>
 </head>
 <body>
  <div id="app"></div>
</body>
</html>
